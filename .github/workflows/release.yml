name: release

# Push a tag like v0.1.0, npm publishes from CI. Provenance enabled.
# Required repo secret: NPM_TOKEN  (npm token create --read-write)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Smoke test
        run: node test.mjs

      - name: Confirm package.json version matches tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG=$(node -p "require('./package.json').version")
          EXPECTED="${TAG#v}"
          if [ "$PKG" != "$EXPECTED" ]; then
            echo "package.json version ($PKG) doesn't match tag ($EXPECTED)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "See [CHANGELOG.md](./CHANGELOG.md) for details. Install with \`npm i -g google-seo-checker\`."
